name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install declared Rust toolchain
        run: rustup show active-toolchain
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev ripgrep
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew list ripgrep >/dev/null 2>&1 || brew install ripgrep
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install ripgrep --yes --no-progress
      - name: Format check
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build shell helper
        run: cargo build --locked -p bob --bin bob-exec
      - name: Unit tests
        if: runner.os != 'Windows'
        run: cargo test --locked --workspace --lib --bins --no-fail-fast
      # Native acceptance tests that drive real PowerShell, Git Bash and ConPTY
      # consoles, plus a two-process SQLite race, fail on hosted Windows runners.
      - name: Unit tests (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: >-
          cargo test --locked --workspace --lib --bins --no-fail-fast --
          --skip native_worker::windows_tests
          --skip ui::windows_tests
          --skip native_windows_
          --skip foreground_and_background_preserve_powershell_syntax_and_streams
          --skip distinct_sessions_in_one_database_have_simultaneous_model_requests

  build:
    name: Build ${{ matrix.target }}
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - name: Install declared Rust toolchain
        run: rustup show active-toolchain
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build release binaries
        env:
          BOB_BUILD_COMMIT: ${{ github.sha }}
        run: cargo build --locked --release -p bob --bins
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: tar -czf bob-${{ matrix.target }}.tar.gz -C target/release bob bob-exec
      - name: Upload (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: bob-${{ matrix.target }}
          path: bob-${{ matrix.target }}.tar.gz
          if-no-files-found: error
      - name: Upload (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: bob-${{ matrix.target }}
          path: |
            target/release/bob.exe
            target/release/bob-exec.exe
          if-no-files-found: error

  # Replaces the `edge` pre-release with this push's binaries once every test
  # and build passes. `bob update` installs from it.
  publish:
    name: Publish edge release
    needs: [test, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-edge
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: bob-*
          path: artifacts
      - name: Collect release files
        run: |
          set -euo pipefail
          mkdir dist
          for target in aarch64-apple-darwin x86_64-unknown-linux-gnu; do
            tar -xzf "artifacts/bob-$target/bob-$target.tar.gz" -C dist
            mv dist/bob "dist/bob-$target"
            mv dist/bob-exec "dist/bob-exec-$target"
          done
          target=x86_64-pc-windows-msvc
          cp "artifacts/bob-$target/bob.exe" "dist/bob-$target.exe"
          cp "artifacts/bob-$target/bob-exec.exe" "dist/bob-exec-$target.exe"
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Replace the edge release
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "main has moved on to $head, whose run publishes instead."
            exit 0
          fi
          gh release delete edge --yes --cleanup-tag || true
          gh api -X DELETE "repos/$GH_REPO/git/refs/tags/edge" >/dev/null 2>&1 || true
          gh release create edge dist/* --prerelease --target "$GITHUB_SHA" \
            --title "main @ ${GITHUB_SHA::7}" \
            --notes "The newest build of main ($GITHUB_SHA), replaced after every push that passes CI. Run \`bob update\` to install it, or download bob and bob-exec for your platform into the same directory."
