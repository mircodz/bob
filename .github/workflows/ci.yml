name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install declared Rust toolchain
        run: rustup show active-toolchain
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev ripgrep
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew list ripgrep >/dev/null 2>&1 || brew install ripgrep
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install ripgrep --yes --no-progress
      - name: Format check
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build shell helper
        run: cargo build --locked -p bob --bin bob-exec
      - name: Unit tests
        if: runner.os != 'Windows'
        run: cargo test --locked --workspace --lib --bins --no-fail-fast
      # Native acceptance tests that drive real PowerShell, Git Bash and ConPTY
      # consoles, plus a two-process SQLite race, fail on hosted Windows runners.
      - name: Unit tests (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: >-
          cargo test --locked --workspace --lib --bins --no-fail-fast --
          --skip native_worker::windows_tests
          --skip ui::windows_tests
          --skip native_windows_
          --skip foreground_and_background_preserve_powershell_syntax_and_streams
          --skip distinct_sessions_in_one_database_have_simultaneous_model_requests

  build:
    name: Build ${{ matrix.target }}
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - name: Install declared Rust toolchain
        run: rustup show active-toolchain
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build release binaries
        run: cargo build --locked --release -p bob --bins
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: tar -czf bob-${{ matrix.target }}.tar.gz -C target/release bob bob-exec
      - name: Upload (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: bob-${{ matrix.target }}
          path: bob-${{ matrix.target }}.tar.gz
          if-no-files-found: error
      - name: Upload (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: bob-${{ matrix.target }}
          path: |
            target/release/bob.exe
            target/release/bob-exec.exe
          if-no-files-found: error
