name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:
    inputs:
      skip-artifacts:
        description: Run validation without CI artifact builds
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install declared Rust toolchain
        run: rustup show active-toolchain
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install search dependency
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Format check
        run: cargo fmt --all --check
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  platform-tests:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install declared Rust toolchain
        run: rustup show active-toolchain
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install search dependency (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew list ripgrep >/dev/null 2>&1 || brew install ripgrep
      - name: Install search dependency (Windows)
        if: runner.os == 'Windows'
        run: choco install ripgrep --yes --no-progress
      - name: Verify PowerShell 7 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pwsh = (Get-Command pwsh -CommandType Application -ErrorAction Stop).Source
          & $pwsh -NoLogo -NoProfile -NonInteractive -Command 'if ($PSVersionTable.PSEdition -ne "Core" -or $PSVersionTable.PSVersion.Major -lt 7) { throw "PowerShell 7 or newer is required" }; $PSVersionTable.PSVersion.ToString()'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native Git Bash (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bash = Join-Path $env:ProgramFiles 'Git\bin\bash.exe'
          if (-not (Test-Path $bash)) { throw "Git for Windows Bash is required: $bash" }
          & $bash --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test workspace
        run: cargo test --workspace

  build:
    name: Build ${{ matrix.target }}
    if: ${{ !inputs.skip-artifacts }}
    needs: [check, platform-tests]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4
      - name: Install declared Rust toolchain and target
        run: rustup target add ${{ matrix.target }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --bin bob --target ${{ matrix.target }}
      - name: Upload bob binary
        uses: actions/upload-artifact@v4
        with:
          name: bob-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/bob${{ matrix.ext }}
          if-no-files-found: error
