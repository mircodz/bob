[workspace]
members = ["src/types", "src/core", "src/cli", "src/protocol", "src/relay", "src/remote", "src/secure"]
default-members = ["src/cli"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"

[workspace.dependencies]
bob-types = { path = "src/types" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
async-trait = "0.1"
regex = "1"
glob = "0.3"
dirs = "5"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
axum = { version = "0.7", features = ["ws"] }
tokio-tungstenite = "0.24"
dashmap = "6"

[profile.release]
lto = true
codegen-units = 1