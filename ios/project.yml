name: BobRemote
options:
  bundleIdPrefix: com.bob.remote
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Bake in signing so xcodegen doesn't reset it every generate.
    DEVELOPMENT_TEAM: "MW5CH26K6Q"
    CODE_SIGN_STYLE: Automatic
targets:
  BobRemote:
    type: application
    platform: iOS
    sources:
      - path: BobRemote
        excludes:
          - "**/*.md"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: BobRemote/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.bob.remote.BobRemote
        PRODUCT_NAME: Bob
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
