[package]
name = "bob-ui"
version.workspace = true
edition.workspace = true
publish = false
description = "Shared terminal presentation primitives for Bob"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
pulldown-cmark = "0.12"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
once_cell = "1"
unicode-width = "0.2.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
