[package]
name = "bob-sdk"
version.workspace = true
edition.workspace = true
description = "Ergonomic builder-style SDK over bob-core: spin up an agent in a few lines."

[lib]
name = "bob_sdk"
path = "src/lib.rs"

[dependencies]
bob-core = { path = "../core" }
bob-types.workspace = true
anyhow.workspace = true
tokio.workspace = true
async-trait.workspace = true

[dev-dependencies]
# Enable bob-core's test doubles (MockProvider) for the SDK's own tests.
bob-core = { path = "../core", features = ["testing"] }
serde_json.workspace = true

[[example]]
name = "minimal"
path = "examples/minimal.rs"

[[example]]
name = "assistant"
path = "examples/assistant.rs"

[[example]]
name = "streaming"
path = "examples/streaming.rs"

[[example]]
name = "subagents"
path = "examples/subagents.rs"

[[example]]
name = "hooks"
path = "examples/hooks.rs"

[[example]]
name = "permissions"
path = "examples/permissions.rs"

[[example]]
name = "sessions"
path = "examples/sessions.rs"

[[example]]
name = "custom_tool"
path = "examples/custom_tool.rs"
