[package]
name = "bob-core"
autotests = false
version.workspace = true
edition.workspace = true
description = "Provider-agnostic, multi-agent coding assistant — core (no UI)."

[lib]
name = "bob_core"
path = "src/lib.rs"

[features]
# Exposes provider test doubles to CLI tests.
testing = []

[dependencies]
bob-types.workspace = true
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
async-trait.workspace = true
regex.workspace = true
glob.workspace = true
globset = "0.4"
dirs.workspace = true
sha2.workspace = true
anyhow.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
toml = "0.8"
toml_edit = "0.22"
getrandom = "0.2"
brush-parser = "0.4.0"
jsonschema = { version = "0.33", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[[test]]
name = "integration"
path = "tests/integration.rs"
