[package]
name = "bob-cli"
version.workspace = true
edition.workspace = true
description = "The bob coding-assistant CLI: terminal chat and local configuration. Produces the `bob` binary."

[[bin]]
name = "bob"
path = "src/main.rs"

[dependencies]
bob-core = { path = "../core" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
async-trait.workspace = true
anyhow.workspace = true
uuid.workspace = true
clap.workspace = true
dirs.workspace = true
ratatui = "0.28"
crossterm = { version = "0.28", features = ["event-stream"] }
pulldown-cmark = "0.12"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
once_cell = "1"
unicode-width = "0.2.2"
