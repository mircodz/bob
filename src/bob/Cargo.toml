[package]
name = "bob"
autobins = false
default-run = "bob"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "bob"
path = "src/main.rs"

[[bin]]
name = "bob-exec"
path = "src/bin/bob-exec.rs"

[dependencies]
bob-kernel = { path = "../kernel" }
bob-core = { path = "../core" }
bob-types.workspace = true
bob-ui = { path = "../ui" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
anyhow.workspace = true
dirs.workspace = true
clap.workspace = true
uuid.workspace = true
sha2.workspace = true
regex.workspace = true
globset = "0.4"
ignore = "0.4"
futures.workspace = true
ratatui = "0.28"
crossterm = { version = "0.28", features = ["event-stream"] }
pulldown-cmark = "0.12"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
once_cell = "1"
unicode-width = "0.2.2"
unicode-segmentation = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
crossterm = { version = "0.28", features = ["use-dev-tty", "libc"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Pipes", "Win32_System_IO"] }
