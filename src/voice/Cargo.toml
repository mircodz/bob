[package]
name = "bob-voice"
version.workspace = true
edition.workspace = true
publish = false
description = "Local speech-to-text for bob: mic capture, Whisper transcription, and text cleanup"


[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
crossbeam-channel = "0.5"
cpal = "0.15"
whisper-rs = { version = "0.14", optional = true, features = ["metal"] }
llama-cpp-2 = { version = "=0.1.154", features = ["metal"] }
encoding_rs = "0.8"

[features]
default = []
whisper = ["dep:whisper-rs"]
